function rotr(a,n){var W=a.length,k=n%W,r=new Array(W),j;for(j=0;j<W;j++)r[(j+k)%W]=a[j];return r}
function bits(v,n){var r=[],i;for(i=n-1;i>=0;i--)r.push((v>>i)&1);return r}
function val(a,s,n){var v=0,i;for(i=0;i<n;i++)v=v*2+a[s+i];return v}
function c15(h){var r=parseInt(h.substr(0,2),16)>>3,g=parseInt(h.substr(2,2),16)>>3,b=parseInt(h.substr(4,2),16)>>3;return (b<<10)|(g<<5)|r}
function encode(tid,pat,ico,bc,fc,key,lang){
var b=c15(bc),f=c15(fc),t1=tid&255,t2=tid>>8;
var U=[b&255,b>>8,f&255,f>>8,ico,pat,0,0];
U[6]=U[0]^U[2]^ico^t2;U[7]=U[1]^U[3]^pat^t1;
var n=key>>4,m=(n<<4)|n,hi=[],i;
for(i=0;i<8;i++)hi=hi.concat(bits(U[i]^m,8));
hi=rotr(hi,key%16);
var full=rotr(hi.concat(bits(key,8)),21),s="";
if(lang==="ja"){for(i=0;i<12;i++)s+=JA[val(full,6*i,6)];return s}
for(i=0;i<14;i++)s+=CH[val(full,5*i,5)];
return s+CH[(val(full,70,2)<<3)|val(full,0,3)]}

es:{s1t:"¿Qué es el TID y cómo consigo el mío?",s1b:"El TID (Trainer ID, «ID de entrenador») es un número de hasta 5 dígitos que identifica tu partida. Para verlo, abre el menú START y entra en tu tarjeta de entrenador: aparece como un número de 5 dígitos junto a tu nombre. Cada código solo funciona con el TID con el que se calculó, así que no se puede compartir entre partidas.",s2t:"El diseño de Daisuki",s2b:"Es el fondo de Pikachu con los colores #FF52A5 y #FF52FF que repartió el Pokémon Daisuki Club, el club de fans oficial de Japón, hacia el lanzamiento de Esmeralda (16 de septiembre de 2004). Los socios escribían su TID en la web del club y recibían su código. Es la única distribución oficial conocida de este sistema; los generadores como este llegaron después, creados por fans. El fondo aparece en la categoría «Amigos» de los fondos de las cajas del PC, donde van los fondos personalizados.",s3t:"¿Cómo se calculan los códigos?",s3b:"El juego empaqueta en 72 bits el diseño, el ícono, los dos colores (5 bits por canal) y valores derivados de tu TID. Una clave aleatoria de 0 a 255 mezcla esos bits y los rota, por eso cada diseño tiene 256 códigos válidos. El resultado se corta en grupos de 5 bits, cada uno una letra de un alfabeto de 32 (15 letras), o en grupos de 6 bits, cada uno un hiragana (12 caracteres, versión japonesa). Al recibir la frase, el juego invierte el proceso y reconstruye el fondo."},
en:{s1t:"What is the TID and how do I find mine?",s1b:"The TID (Trainer ID) is a number of up to 5 digits that identifies your save file. To see it, open the START menu and enter your Trainer Card: it appears as a 5-digit number next to your name. Each code only works with the TID it was calculated for, so codes can’t be shared between save files.",s2t:"The Daisuki design",s2b:"This is the Pikachu wallpaper with the colors #FF52A5 and #FF52FF that the Pokémon Daisuki Club, Japan’s official fan club, handed out around Emerald’s launch (September 16, 2004). Members typed their TID into the club website and received their code. It is the only known official distribution of this system; generators like this one came later, made by fans. The wallpaper appears in the “Friends” category of the PC box wallpapers (“Daisuki” in Japanese).",s3t:"How are the codes calculated?",s3b:"The game packs the pattern, the icon, the two colors (5 bits per channel) and values derived from your TID into 72 bits. A random key from 0 to 255 masks and rotates those bits, which is why every design has 256 valid codes. The result is then cut into groups of 5 bits, each one a letter from a 32-letter alphabet (15 letters), or into groups of 6 bits, each one a hiragana (12 characters, Japanese version). When you say the phrase, the game reverses the process to rebuild the wallpaper."},
fr:{s1t:"Qu’est-ce que l’ID dresseur et comment le trouver ?",s1b:"L’ID dresseur (TID) est un nombre de 5 chiffres au maximum qui identifie votre sauvegarde. Pour le voir, ouvrez le menu START et consultez votre carte de dresseur : il s’affiche sous forme de nombre à 5 chiffres près de votre nom. Chaque code ne fonctionne qu’avec l’ID pour lequel il a été calculé ; il ne peut donc pas être partagé entre sauvegardes.",s2t:"Le motif Daisuki",s2b:"C’est le fond Pikachu aux couleurs #FF52A5 et #FF52FF distribué par le Pokémon Daisuki Club, le club de fans officiel du Japon, lors de la sortie d’Émeraude (16 septembre 2004). Les membres saisissaient leur ID sur le site du club et recevaient leur code. C’est la seule distribution officielle connue de ce système ; les générateurs comme celui-ci sont venus ensuite, créés par des fans. Le fond apparaît dans la catégorie « Friends » (« Daisuki » en japonais) des fonds des boîtes du PC.",s3t:"Comment les codes sont-ils calculés ?",s3b:"Le jeu range dans 72 bits le motif, l’icône, les deux couleurs (5 bits par canal) et des valeurs dérivées de votre ID. Une clé aléatoire de 0 à 255 masque et fait tourner ces bits, d’où les 256 codes valides pour chaque motif. Le résultat est découpé en groupes de 5 bits, chacun une lettre d’un alphabet de 32 (15 lettres), ou en groupes de 6 bits, chacun un hiragana (12 caractères, version japonaise). En recevant la phrase, le jeu inverse le processus pour reconstruire le fond."},
de:{s1t:"Was ist die Trainer-ID und wie finde ich meine?",s1b:"Die Trainer-ID (TID) ist eine Zahl mit bis zu 5 Stellen, die deinen Spielstand kennzeichnet. Du siehst sie, wenn du das START-Menü öffnest und deine Trainerkarte aufrufst: Sie steht als 5-stellige Zahl neben deinem Namen. Jeder Code funktioniert nur mit der ID, für die er berechnet wurde, und lässt sich daher nicht zwischen Spielständen teilen.",s2t:"Das Daisuki-Muster",s2b:"Das ist das Pikachu-Hintergrundbild in den Farben #FF52A5 und #FF52FF, das der Pokémon Daisuki Club, der offizielle Fanclub Japans, zum Erscheinen von Smaragd (16. September 2004) verteilte. Mitglieder gaben ihre ID auf der Club-Website ein und erhielten ihren Code. Es ist die einzige bekannte offizielle Verteilung dieses Systems; Generatoren wie dieser kamen später und stammen von Fans. Das Bild erscheint in der Kategorie „Friends“ („Daisuki“ auf Japanisch) der PC-Box-Hintergründe.",s3t:"Wie werden die Codes berechnet?",s3b:"Das Spiel packt Muster, Symbol, beide Farben (5 Bit pro Kanal) und aus deiner ID abgeleitete Werte in 72 Bit. Ein zufälliger Schlüssel von 0 bis 255 maskiert und rotiert diese Bits, deshalb hat jedes Muster 256 gültige Codes. Das Ergebnis wird in 5-Bit-Gruppen geschnitten, jede ein Buchstabe aus einem 32er-Alphabet (15 Buchstaben), oder in 6-Bit-Gruppen, jede ein Hiragana (12 Zeichen, japanische Version). Bei der Eingabe kehrt das Spiel den Vorgang um und baut das Hintergrundbild wieder auf."},
it:{s1t:"Che cos’è l’ID allenatore e come trovo il mio?",s1b:"L’ID allenatore (TID) è un numero di al massimo 5 cifre che identifica il tuo salvataggio. Per vederlo apri il menu START ed entra nella tua scheda allenatore: compare come numero di 5 cifre accanto al tuo nome. Ogni codice funziona solo con l’ID per cui è stato calcolato, quindi non si può condividere tra salvataggi diversi.",s2t:"Il motivo Daisuki",s2b:"È lo sfondo di Pikachu con i colori #FF52A5 e #FF52FF distribuito dal Pokémon Daisuki Club, il fan club ufficiale giapponese, in occasione dell’uscita di Smeraldo (16 settembre 2004). I soci inserivano il proprio ID sul sito del club e ricevevano il codice. È l’unica distribuzione ufficiale nota di questo sistema; i generatori come questo sono arrivati dopo, creati dai fan. Lo sfondo compare nella categoria “Friends” (“Daisuki” in giapponese) degli sfondi dei box del PC.",s3t:"Come si calcolano i codici?",s3b:"Il gioco impacchetta in 72 bit il motivo, l’icona, i due colori (5 bit per canale) e valori derivati dal tuo ID. Una chiave casuale da 0 a 255 maschera e ruota questi bit, per questo ogni motivo ha 256 codici validi. Il risultato viene diviso in gruppi di 5 bit, ciascuno una lettera di un alfabeto di 32 (15 lettere), oppure in gruppi di 6 bit, ciascuno un hiragana (12 caratteri, versione giapponese). Quando inserisci la frase, il gioco inverte il processo e ricostruisce lo sfondo."},
ja:{s1t:"IDとは？どうやって見る？",s1b:"ID(トレーナーID)はセーブデータを識別する、5桁までの数字です。STARTメニューからトレーナーカードを開くと、名前の近くに5桁の数字として表示されます。コードは計算に使ったIDでしか使えないため、ほかのセーブデータとは共有できません。",s2t:"だいすきのもよう",s2b:"ポケモンだいすきクラブが、エメラルド発売（2004年9月16日）ごろに配布した、#FF52A5と#FF52FFのピカチュウの壁紙です。会員がクラブのサイトにIDを入力するとコードがもらえました。この仕組みの公式配布としては唯一知られているもので、このような計算ツールはその後ファンが作りました。壁紙はボックスの「だいすき」カテゴリに追加されます。",s3t:"コードの計算方法",s3b:"ゲームは、もよう・アイコン・2つの色(1色あたり5ビット)・IDから作った値を72ビットにまとめます。0〜255のランダムな鍵でそのビットを混ぜて回転させるため、同じもようでも有効なコードは256通りあります。結果は6ビットずつに区切ってひらがな12文字にします(海外版は5ビットずつに区切って15文字)。ことばを入力すると、ゲームがこの処理を逆にたどって壁紙を復元します。"}};

s1t:"IDとは？ どうやって みる？",s1b:"ID「トレーナーID」は セーブデータを みわける 5けたまでの すうじです。STARTメニューから トレーナーカードを ひらくと なまえの ちかくに 5けたの すうじで ひょうじされます。コードは けいさんに つかった IDでしか つかえないので ほかの セーブデータとは きょうゆうできません。",
